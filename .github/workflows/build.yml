name: Build KB Booster Auto

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o codigo
        uses: actions/checkout@v4

      - name: Instalar Java 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'

      - name: Instalar Gradle 2.14.1 (exigido pelo ForgeGradle 2.1)
        run: |
          wget -q https://services.gradle.org/distributions/gradle-2.14.1-bin.zip
          unzip -q gradle-2.14.1-bin.zip -d "$HOME"
          echo "$HOME/gradle-2.14.1/bin" >> "$GITHUB_PATH"

      - name: Compilar o mod
        run: gradle setupCIWorkspace build --no-daemon --stacktrace

      - name: Publicar o JAR como artefato
        uses: actions/upload-artifact@v4
        with:
          name: KBBoosterAuto-jar
          path: |
            build/libs/*.jar
            !build/libs/*-sources.jar
